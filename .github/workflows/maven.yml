name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 27
        uses: actions/setup-java@v4
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven

      # certs/ is git-ignored, so CI creates a throwaway key pair just for the build.
      - name: Generate JWT keys
        run: |
          mkdir certs
          openssl genrsa -out certs/keypair.pem 2048
          openssl rsa -in certs/keypair.pem -pubout -out certs/public.pem
          openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt -in certs/keypair.pem -out certs/private.pem
          rm certs/keypair.pem

      # No .env in CI: point MongoDB at a dummy address and skip index creation,
      # so the context test starts the app without connecting to Atlas.
      - name: Build and Test with Maven
        run: mvn clean verify --file pom.xml
        env:
          SPRING_MONGODB_URI: mongodb://localhost:27017/ci
          SPRING_DATA_MONGODB_AUTOINDEXCREATION: "false"
