# Run test classes and methods in parallel.
# Spring context tests opt out per class with @Execution(SAME_THREAD) because they share
# Mockito bean overrides across methods.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=dynamic

spring.application.name=scrape-engine
spring.config.import=optional:file:.env[.properties]
spring.threads.virtual.enabled=true
spring.jpa.database-platform=MongoDB
spring.mongodb.uri=mongodb+srv://${DB_MONGO_USER}:${DB_MONGO_PASS}@data-finance-1.24yd25c.mongodb.net/scrape-config\
?retryWrites=true&w=majority\
&maxPoolSize=20&minPoolSize=2&maxIdleTimeMS=60000\
&waitQueueTimeoutMS=5000&serverSelectionTimeoutMS=5000
spring.jpa.properties.com.mongodb.hibernate.semantics.nulls=MQL
spring.data.mongodb.auto-index-creation=true
rsa.public-key=file:certs/public.pem
rsa.private-key=file:certs/private.pem